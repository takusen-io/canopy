services:
  canopy-1:
    container_name: takusen-canopy-1
    build:
      context: ../..
      dockerfile: plugin/go/Dockerfile
    environment:
      TAKUSEN_PLUGIN_RPC_ADDRESS: 0.0.0.0:50010
      TAKUSEN_PLUGIN_RPC_TOKEN: ${CANOPY_PLUGIN_TOKEN:-local-compose-plugin-token-000000000000}
    ports:
      - "50002:50002"
      - "50003:50003"
      - "127.0.0.1:50010:50010"
    volumes:
      - ../../.docker/volumes/node_1:/root/.canopy
    networks:
      takusen-canopy:
        aliases: [node-1]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --header='Authorization: Bearer '$$TAKUSEN_PLUGIN_RPC_TOKEN http://127.0.0.1:50010/health"]
      interval: 3s
      timeout: 2s
      retries: 40

  canopy-2:
    container_name: takusen-canopy-2
    build:
      context: ../..
      dockerfile: plugin/go/Dockerfile
    environment:
      TAKUSEN_PLUGIN_RPC_ADDRESS: 0.0.0.0:50010
      TAKUSEN_PLUGIN_RPC_TOKEN: ${CANOPY_PLUGIN_TOKEN:-local-compose-plugin-token-000000000000}
    ports:
      - "40002:40002"
      - "40003:40003"
      - "127.0.0.1:50011:50010"
    volumes:
      - ../../.docker/volumes/node_2:/root/.canopy
    networks:
      takusen-canopy:
        aliases: [node-2]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --header='Authorization: Bearer '$$TAKUSEN_PLUGIN_RPC_TOKEN http://127.0.0.1:50010/health"]
      interval: 3s
      timeout: 2s
      retries: 40

networks:
  takusen-canopy:
    name: takusen-canopy
