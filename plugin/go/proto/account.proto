syntax = "proto3";
package types;
option go_package = "github.com/canopy-network/go-plugin/contract";

// An account is a structure that holds funds and can send or receive transactions using a crypto key pair
// Each account has a unique address and a balance, think a bank account - but managed by the blockchain
// instead of a bank
message Account {
  // address: the short version of a public key
  bytes address = 1;
  // amount: the balance of funds the account has
  uint64 amount = 2;
  // Keep the complete shared Canopy account wire shape. Core owns vesting;
  // plugin balance writes must preserve it.
  uint64 vesting_amount = 3;
  uint64 vesting_start_height = 4;
  uint64 vesting_cliff_height = 5;
  uint64 vesting_end_height = 6;
  // nonce: the minimum accepted sequence number for nonce-protected transactions
  uint64 nonce = 7;
  // The single height-locked collateral bucket created by servicer bond
  // reductions. It remains slashable until it becomes spendable.
  uint64 unbonding_amount = 8;
  uint64 unbonding_release_height = 9;
}

// A pool is like an account without an owner, holding funds that are managed directly by the blockchain protocol
// It's very similar to an account but instead of an address it has a unique ID and operates based on predefined
// blockchain rules rather than individual control
message Pool {
  // id: the unique identifier of the pool
  uint64 id = 1;
  // amount: the balance of funds the pool has
  uint64 amount = 2;
}

// Validator mirrors the core Canopy validator wire format. Takusen reads these
// records from the shared state tree to calculate stake-weighted observation
// quorums; it never writes them.
message Validator {
  bytes address = 1;
  bytes public_key = 2;
  string net_address = 3;
  uint64 staked_amount = 4;
  repeated uint64 committees = 5;
  uint64 max_paused_height = 6;
  uint64 unstaking_height = 7;
  bytes output = 8;
  bool delegate = 9;
  bool compound = 10;
}

message EnclaveKey {
  bytes owner_address = 1;
  string tee_key_id = 2;
  bytes public_key = 3;
  bytes attestation_hash = 4;
  bytes pcr0 = 5;
  bytes pcr1 = 6;
  bytes pcr2 = 7;
  uint64 registered_height = 8;
  // active receives new assignments; draining may finish assignments already
  // bound to it; revoked is terminal and cannot submit receipts.
  string status = 9;
}

message Servicer {
  bytes owner_address = 1;
  bytes evm_payout_address = 2;
  string tee_key_id = 3;
  repeated string models = 4;
  uint64 bond = 5;
  bool active = 6;
  uint64 registered_height = 7;
  uint64 failure_count = 8;
  uint64 total_slashed = 9;
  uint64 revision = 10;
}

message Assignment {
  string model = 1;
  bytes servicer_address = 2;
  bool completed = 3;
  string execution_id = 4;
  string tee_key_id = 5;
  string provider = 6;
  string terminal_status = 7;
  uint64 max_provider_cost = 8;
}

message RequestRecord {
  string request_id = 1;
  bytes input_hash = 2;
  bytes requester = 3;
  string output_type = 4;
  repeated string models = 5;
  // Display-only agreement observation threshold.
  uint32 execution_quorum = 6;
  uint64 deadline_height = 7;
  uint64 authorized_height = 8;
  bytes assignment_seed = 9;
  repeated Assignment assignments = 10;
  string status = 11;
  bytes consensus_output_hash = 12;
  uint32 agreement_count = 13;
  bytes settlement_tx_hash = 14;
  uint64 parameter_revision = 15;
  uint32 foundation_fee_bps = 16;
  uint32 servicer_margin_bps = 17;
  bytes authorization_signature_hash = 18;
  string request_archive_id = 19;
  bytes settlement_domain_id = 20;
  int64 output_minimum = 21;
  int64 output_maximum = 22;
  repeated string output_choices = 23;
  bytes schema_hash = 24;
  // Immutable request budget copied into the active-assignment index so
  // servicer discovery does not fan out into request and reservation reads.
  uint64 reserved_budget = 25;
}

message ExecutionRecord {
  string execution_id = 1;
  string request_id = 2;
  string model = 3;
  bytes servicer_address = 4;
  string status = 5;
  string output = 6;
  bytes output_hash = 7;
  uint64 cost = 8;
  string tee_key_id = 9;
  bytes receipt_digest = 10;
  string archive_id = 11;
  uint64 committed_height = 12;
  uint64 provider_cost = 13;
  uint64 servicer_margin = 14;
  uint64 foundation_fee = 15;
  string provider = 16;
  bytes receipt_signature = 17;
  bytes settlement_tx_hash = 18;
  bool settled = 19;
  bytes settlement_domain_id = 20;
}

message Observation {
  bytes subject_hash = 1;
  bytes observer_address = 2;
  uint64 observed_height = 3;
  bytes claim_hash = 4;
  // Immutable committee snapshot that authorized this vote. Votes from
  // different epochs or validator sets are never combined.
  uint64 validator_set_id = 5;
  uint64 observer_weight = 6;
  uint64 total_weight = 7;
  uint64 validator_epoch = 8;
}

message BlockAnchor {
  uint64 height = 1;
  bytes previous_block_hash = 2;
}

message DepositRecord {
  bytes chain_tx_hash = 1;
  bytes requester = 2;
  uint64 amount = 3;
  uint64 observed_height = 4;
  string status = 5;
  uint64 resolved_height = 6;
  bytes settlement_domain_id = 7;
  bytes token_amount = 8;
}

message CreditAccount {
  bytes requester = 1;
  uint64 deposited = 2;
  uint64 reserved = 3;
  uint64 settled = 4;
  uint64 released = 5;
  uint64 provisional = 6;
  uint64 provisional_reserved = 7;
  uint64 reorged = 8;
  bytes settlement_domain_id = 9;
}

message ReservationRecord {
  string request_id = 1;
  bytes requester = 2;
  uint64 budget = 3;
  uint64 spent = 4;
  uint64 released = 5;
  string status = 6;
  uint64 reserved_height = 7;
  uint64 released_height = 8;
  uint64 authorization_deadline = 9;
  uint64 provisional_budget = 10;
  bytes settlement_domain_id = 11;
}

message PendingAuthorization {
  string request_id = 1;
  bytes settlement_domain_id = 2;
  bytes authorization = 3;
  uint64 queued_height = 4;
}

message SettlementDomain {
  bytes id = 1;
  uint64 chain_id = 2;
  bytes token_address = 3;
  bytes escrow_address = 4;
  bytes verifier_address = 5;
  bytes foundation_treasury_address = 6;
  uint32 token_decimals = 7;
  string network = 8;
  repeated string deposit_mechanisms = 9;
  string finality_policy = 10;
  uint32 confirmations = 11;
  bool active = 12;
  string authorization_name = 13;
  string authorization_version = 14;
}

message ModelParams {
  string model = 1;
  string provider = 2;
  uint64 maximum_execution_budget = 3;
  bool active = 4;
}

message PCRPolicy {
  bytes pcr0 = 1;
  bytes pcr1 = 2;
  bytes pcr2 = 3;
  bool active = 4;
}

// ProtocolParams is replaced atomically by a validator-quorum governance
// observation. Revision must increase by exactly one, preventing stale or
// replayed parameter changes.
message ProtocolParams {
  uint64 revision = 1;
  repeated ModelParams models = 2;
  repeated PCRPolicy approved_pcrs = 3;
  uint32 foundation_fee_bps = 4;
  uint32 servicer_margin_bps = 5;
  uint64 authorization_deadline_blocks = 8;
  uint64 minimum_servicer_bond = 9;
  uint64 minimum_validator_bond = 10;
  uint32 invalid_receipt_slash_bps = 11;
  uint64 servicer_unbonding_blocks = 13;
  uint64 emission_per_epoch = 14;
  bytes treasury_address = 15;
  uint32 treasury_bps = 16;
  uint64 canonical_chain_id = 17;
  bytes canonical_token_address = 18;
  bytes canonical_bridge_address = 19;
  uint64 bridge_epoch_mint_limit = 21;
  uint64 bridge_transfer_limit = 22;
  uint64 settlement_interval_blocks = 23;
  repeated string supported_output_schemas = 24;
  repeated string default_models = 25;
  repeated SettlementDomain settlement_domains = 26;
  // DER-encoded X.509 root that anchors Nitro attestation certificate chains.
  // Governance replaces this atomically with the rest of the protocol params.
  bytes nitro_trust_root = 28;
}

message SlashEvidence {
  bytes evidence_id = 1;
  bytes target_address = 2;
  string reason = 3;
  uint64 penalty = 4;
  uint64 observed_height = 5;
}

message ProducerPayout {
  bytes owner_address = 1;
  bytes canonical_chain_address = 2;
}

message ProducerRecord {
  uint64 epoch = 1;
  bytes producer_address = 2;
  uint64 blocks = 3;
}

// ProducerIdentity is created only by end-block processing after an address
// actually proposes a block. It cannot be created by a user transaction.
message ProducerIdentity {
  bytes owner_address = 1;
}

message RewardAllocation {
  bytes producer_address = 1;
  bytes canonical_chain_recipient = 2;
  uint64 blocks = 3;
  uint64 amount = 4;
}

message EpochAuthorization {
  uint64 epoch = 1;
  uint64 start_height = 2;
  uint64 end_height = 3;
  uint64 validator_set_id = 4;
  repeated RewardAllocation allocations = 5;
  bytes treasury_address = 6;
  uint64 treasury_amount = 7;
  uint64 producer_amount = 8;
  uint64 total_amount = 9;
  bytes canonical_chain_digest = 10;
  string status = 11;
  bytes canonical_chain_mint_tx_hash = 13;
}

// EpochClock is the sole authority for the consensus-time epoch schedule.
// Heights only record the blocks which first crossed each timestamp.
message EpochClock {
  uint64 current_epoch = 1;
  uint64 validator_set_id = 2;
  uint64 start_timestamp = 3;
  uint64 freeze_timestamp = 4;
  uint64 nominal_end_timestamp = 5;
  uint64 consensus_time_seconds = 6;
  uint64 start_height = 7;
  uint64 freeze_height = 8;
  uint64 end_height = 9;
  // True after core's exact N+1 candidate has been frozen, including when its
  // weighted roster is unchanged and no cross-chain handoff is necessary.
  bool validator_roster_frozen = 10;
  bool validator_handoff_prepared = 11;
  // Unix seconds at which scheduled EVM verifiers permanently stop accepting
  // the outgoing committee until incoming activation.
  uint64 validator_handoff_timestamp = 12;
  // The domain set is frozen with the prepared validator roster. Governance
  // edits apply to a later handoff and cannot rewrite an in-flight generation.
  repeated bytes validator_handoff_domains = 13;
  bytes validator_handoff_roster_hash = 16;
  bytes validator_handoff_domain_set_hash = 17;
  uint64 validator_handoff_outgoing_authority_cutoff = 18;
  uint64 validator_handoff_native_chain_id = 19;
  uint64 validator_handoff_domain_count = 20;
  uint64 validator_handoff_resolved_count = 21;
  bool failed_epoch = 22;
}

// EpochAccountingJob snapshots the governed values needed to finish rewards
// and bounded slash application after authority has already advanced.
message EpochAccountingJob {
  uint64 epoch = 1;
  uint64 emission_per_epoch = 2;
  bytes treasury_address = 3;
  uint32 treasury_bps = 4;
  uint64 canonical_chain_id = 5;
  bytes canonical_token_address = 6;
}

message BridgeState {
  uint64 outbound_nonce = 1;
  uint64 mint_epoch = 2;
  uint64 minted_in_epoch = 3;
}

message BridgeMint {
  bytes canonical_chain_tx_hash = 1;
  uint64 nonce = 2;
  bytes canonical_chain_sender = 3;
  bytes recipient = 4;
  uint64 amount = 5;
  uint64 observed_height = 6;
}

message BridgeBurn {
  bytes burn_id = 1;
  uint64 nonce = 2;
  bytes owner_address = 3;
  bytes canonical_chain_recipient = 4;
  uint64 amount = 5;
  uint64 burned_height = 6;
  uint64 validator_set_id = 7;
  bytes canonical_chain_digest = 8;
  string status = 9;
  bytes canonical_chain_release_tx_hash = 10;
  uint64 release_validator_set_id = 11;
}

message ReplayMarker {
  bytes id = 1;
}

// SettlementDomainLifecycleIntent is created only by Canopy's standard
// changeParameter governance lifecycle. Observer credentials cannot create or
// modify it; they may sign only the exact action while this intent is live.
message SettlementDomainLifecycleIntent {
  bytes id = 1;
  bytes settlement_domain_id = 2;
  bytes deactivation_generation = 3;
  string action = 4;
  uint64 nonce = 5;
  uint64 expires_at_timestamp = 6;
}

// QuorumProof is the finalized, EVM-consumable BDN proof for one exact
// domain-separated digest. Public keys and signatures retain Canopy's compact
// encoding while the EIP-2537 fields use the uncompressed 64-byte-coordinate
// encoding expected by the EIP-2537 precompiles.
message QuorumProof {
  string proof_kind = 1;
  bytes proof_id = 2;
  bytes digest = 3;
  uint64 validator_set_id = 4;
  bytes signer_bitmap = 5;
  bytes aggregate_signature_eip2537 = 6;
  uint64 signed_weight = 7;
  uint64 total_weight = 8;
  uint64 completed_height = 9;
  uint64 new_validator_set_id = 10;
  uint64 rotation_nonce = 11;
  bytes settlement_domain_id = 12;
  bytes handoff_generation = 13;
  uint64 handoff_timestamp = 14;
  uint64 control_block_number = 15;
  bytes control_block_hash = 16;
  bytes lifecycle_intent_id = 17;
  uint64 outgoing_authority_cutoff = 18;
}

// ConsensusCertificate is a bounded auxiliary fact certified as part of a
// finalized Native quorum certificate. Auxiliary participation is optional
// for ordinary block consensus; this record exists only after strictly more
// than two-thirds of the frozen committee signed the exact digest.
message ConsensusCertificate {
  string kind = 1;
  bytes key = 2;
  bytes digest = 3;
  bytes payload = 4;
  uint64 validator_set_id = 5;
  uint64 validator_epoch = 6;
  bytes signer_bitmap = 7;
  bytes aggregate_signature = 8;
  bytes aggregate_signature_eip2537 = 9;
  uint64 signed_weight = 10;
  uint64 total_weight = 11;
  uint64 completed_height = 12;
}

// ValidatorHandoffDomainManifest is one settlement-domain leaf in the
// consensus-created global handoff manifest. The leaf hash uses Solidity ABI
// fixed-width encoding and the manifest root is a positional Keccak Merkle
// tree over leaves sorted by settlement_domain_id.
message ValidatorHandoffDomainManifest {
  bytes settlement_domain_id = 1;
  uint64 evm_chain_id = 2;
  bytes verifier_address = 3;
  uint64 rotation_nonce = 4;
  bytes validator_keys_hash = 5;
  bytes validator_weights_hash = 6;
  bytes leaf_hash = 7;
  bytes scheduled_validator_set_hash = 8;
}

// ValidatorHandoffManifest is atomically created when the roster freezes.
// Its root is certified by optional
// next-height consensus vote attachments, never by plugin transactions.
message ValidatorHandoffManifest {
  bytes root = 1;
  uint64 created_height = 2;
  uint64 native_chain_id = 3;
  uint64 epoch = 4;
  uint64 old_validator_set_id = 5;
  uint64 new_validator_set_id = 6;
  bytes frozen_roster_hash = 7;
  bytes frozen_domain_set_hash = 8;
  bytes generation = 10;
  uint64 handoff_timestamp = 11;
  uint64 outgoing_authority_cutoff = 12;
  repeated ValidatorHandoffDomainManifest domains = 13;
}

message SettlementDomainRotationState {
  bytes settlement_domain_id = 1;
  uint64 rotation_nonce = 2;
}

message QuorumSignatureShare {
  bytes proof_id = 1;
  bytes observer_address = 2;
  bytes signature = 3;
  uint64 observed_height = 4;
}
