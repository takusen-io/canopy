syntax = "proto3";
package types;
option go_package = "github.com/canopy-network/go-plugin/contract";

import "google/protobuf/any.proto";
import "account.proto";
// Transaction represents a request or action submitted to the network like transfer assets or perform other operations
// within the blockchain system - THIS MUST MATCH lib.Transaction EXACTLY for signing
message Transaction {
  // message_type: The type of the transaction like 'send' or 'stake'
  string message_type = 1; // @gotags: json:"messageType"
  // msg: The actual transaction message payload, which is encapsulated in a generic message format
  google.protobuf.Any msg = 2;
  // signature: The cryptographic signature used to verify the authenticity of the transaction
  Signature signature = 3;
  // created_height: The height when the transaction was created - allows 'safe pruning'
  uint64 created_height = 4; // @gotags: json:"createdHeight"
  // time: The timestamp when the transaction was created - used as temporal entropy to prevent hash collisions in txs
  uint64 time = 5;
  // fee: The fee associated with processing the transaction
  uint64 fee = 6;
  // memo: An optional message or note attached to the transaction
  string memo = 7;
  // network_id: The identity of the network the transaction is intended for
  uint64 network_id = 8; // @gotags: json:"networkID"
  // chain_id: The identity of the committee the transaction is intended for
  uint64 chain_id = 9; // @gotags: json:"chainID"
  // nonce: The sender's protocol replay-protection nonce
  uint64 nonce = 10;
  // NOTE: CAN EXTEND FUNCTIONALITY BY ADDING ADDITIONAL FIELDS
  // NO CONFLICT STARTING AT FIELD = 25
}

// MessageSend is a standard transfer transaction, taking tokens from the sender and transferring
// them to the recipient
message MessageObserveEnclave {
  bytes observer_address = 1;
  bytes owner_address = 2;
  string tee_key_id = 3;
  bytes public_key = 4;
  bytes attestation_hash = 5;
  bytes pcr0 = 6;
  bytes pcr1 = 7;
  bytes pcr2 = 8;
  bytes nonce = 9;
  bytes user_data = 10;
  bytes proof_signature = 11;
  // Complete COSE/CBOR Nitro evidence is consensus transaction history. It is
  // intentionally not retained in active EnclaveKey state after registration.
  bytes attestation_document = 12;
}

message MessageRevokeEnclave {
  bytes observer_address = 1;
  string tee_key_id = 2;
}

message MessageRegisterServicer {
  bytes owner_address = 1;
  repeated SettlementPayout payouts = 2;
  string tee_key_id = 3;
  repeated string models = 4;
  uint64 bond = 5;
}

message MessageUpdateServicer {
  bytes owner_address = 1;
  repeated SettlementPayout payouts = 2;
  string tee_key_id = 3;
  repeated string models = 4;
  uint64 additional_bond = 5;
  bool active = 6;
}

message MessageObserveDeposit {
  bytes observer_address = 1;
  bytes settlement_domain_id = 2;
  bytes chain_tx_hash = 3;
  bytes requester = 4;
  uint64 amount_micros = 5;
  bytes token_amount = 6;
  // provisional is set by each observer from its local chain finality policy.
  // It is never trusted from the API request.
  bool provisional = 7;
}

// MessageResolveDeposit lets the same validator quorum either promote a
// provisional deposit after chain safe finality or orphan it after a reorg.
message MessageResolveDeposit {
  bytes observer_address = 1;
  bytes settlement_domain_id = 2;
  bytes chain_tx_hash = 3;
  string resolution = 4;
}

// MessageResolveSettlement identifies the exact execution segment whose EVM
// transaction disappeared so it can become independently settleable again.
message MessageResolveSettlement {
  bytes observer_address = 1;
  bytes settlement_domain_id = 2;
  string request_id = 3;
  bytes settlement_tx_hash = 4;
  repeated string execution_ids = 5;
  bool finalizes_request = 6;
}

message MessageObserveAuthorization {
  reserved 9;
  bytes observer_address = 1;
  string request_id = 2;
  bytes input_hash = 3;
  bytes requester = 4;
  uint64 reserved_budget = 5;
  string output_type = 6;
  repeated string models = 7;
  // Display-only agreement observation threshold.
  uint32 execution_quorum = 8;
  uint64 deadline_height = 10;
  bytes authorization_signature = 11;
  uint64 authorization_deadline = 12;
  // direct_eoa lets the native state machine verify an ordinary EOA's EIP-712
  // signature itself. Contract-wallet signatures retain validator observation.
  bool direct_eoa = 13;
  // Content address of the replicated full request input. Admission is
  // fail-closed unless this artifact was published first.
  string request_archive_id = 14;
  // ERC-1271 authorization is evaluated at this settlement chain's canonical
  // safe header.
  // EOA authorization is state-independent and leaves both fields empty.
  uint64 authorization_chain_block_number = 15;
  bytes authorization_chain_block_hash = 16;
  bytes settlement_domain_id = 17;
  int64 output_minimum = 18;
  int64 output_maximum = 19;
  repeated string output_choices = 20;
  bytes schema_hash = 21;
}

// MessageObserveAuthorizations admits a short cohort of independently signed
// requester authorizations in one Canopy transaction. Every item retains the
// same native EIP-712 validation as the single-request path.
message MessageObserveAuthorizations {
  bytes observer_address = 1;
  repeated MessageObserveAuthorization authorizations = 2;
}

message MessageSubmitExecution {
  bytes servicer_address = 1;
  bytes receipt_json = 2;
  bytes public_key = 3;
  bytes signature = 4;
  string archive_id = 5;
}

message MessageSubmitExecutions {
  bytes servicer_address = 1;
  repeated MessageSubmitExecution executions = 2;
  bytes public_key = 3;
  // Gzip-compressed protobuf MessageSubmitExecutions containing only the
  // executions field. The outer signer identity remains uncompressed.
  bytes compressed_executions = 4;
}

message MessageReassignRequest {
  bytes observer_address = 1;
  string request_id = 2;
  string model = 3;
  uint64 new_deadline_height = 4;
}

message MessageFinalizeRequest {
  reserved 4;
  bytes observer_address = 1;
  string request_id = 2;
  bytes settlement_tx_hash = 3;
  uint64 reserved_budget = 5;
  uint64 validator_set_id = 6;
  bytes signer_bitmap = 7;
  bytes aggregate_signature = 8;
  repeated string execution_ids = 9;
  bool finalizes_request = 10;
  uint64 request_spent = 11;
  bytes settlement_domain_id = 12;
}

message MessageFinalizeRequests {
  bytes observer_address = 1;
  repeated MessageFinalizeRequest requests = 2;
  uint64 validator_set_id = 3;
  bytes signer_bitmap = 4;
  bytes aggregate_signature = 5;
}

// MessageSubmitQuorumSignature lets an active validator attest to the exact
// digest an EVM contract will verify. The outer Canopy transaction authenticates the
// observer; signature is a second BDN/BLS signature over message (normally the
// 32-byte EVM digest) so shares can be aggregated and exported to the target chain.
message MessageSubmitQuorumSignature {
  bytes observer_address = 1;
  string proof_kind = 2;
  bytes proof_id = 3;
  bytes digest = 4;
  bytes message = 5;
  uint64 validator_set_id = 6;
  bytes signature = 7;
  repeated bytes validator_keys = 8;
  repeated uint64 validator_weights = 9;
  uint64 new_validator_set_id = 10;
  reserved 11;
  string request_id = 12;
  bytes settlement_tx_hash = 13;
  uint64 reserved_budget = 14;
  repeated string execution_ids = 15;
  bool finalizes_request = 16;
  uint64 request_spent = 17;
  uint64 batch_nonce = 18;
  bytes settlement_payload = 19;
  repeated MessageFinalizeRequest finalizations = 20;
  bytes settlement_domain_id = 21;
  uint64 rotation_nonce = 22;
  uint64 epoch = 23;
  bytes burn_id = 24;
  bytes handoff_generation = 25;
  uint64 handoff_timestamp = 26;
  uint64 control_block_number = 27;
  bytes control_block_hash = 28;
  bytes lifecycle_intent_id = 29;
}

message MessageObserveBridgeLock {
  bytes observer_address = 1;
  bytes canonical_chain_tx_hash = 2;
  uint64 nonce = 3;
  bytes canonical_chain_sender = 4;
  bytes recipient = 5;
  uint64 amount = 6;
}

message MessageBurnBridge {
  bytes owner_address = 1;
  bytes canonical_chain_recipient = 2;
  uint64 amount = 3;
  bytes burn_id = 4;
}

message MessageObserveBridgeRelease {
  bytes observer_address = 1;
  bytes burn_id = 2;
  bytes canonical_chain_tx_hash = 3;
  uint64 nonce = 4;
  bytes canonical_chain_recipient = 5;
  uint64 amount = 6;
  uint64 validator_set_id = 7;
}

message MessageObserveEpochMint {
  bytes observer_address = 1;
  uint64 epoch = 2;
  bytes canonical_chain_tx_hash = 3;
  uint64 validator_set_id = 4;
}

message MessageQueueServicerStake {
  bytes owner_address = 1;
  uint64 target_bond = 2;
  bool active = 3;
  bool auto_compound = 4;
}

message MessageWithdrawUnbonded {
  bytes owner_address = 1;
  uint64 sequence = 2;
}

message MessageSetProducerPayout {
  bytes owner_address = 1;
  bytes canonical_chain_address = 2;
}

message MessageObserveSlashEvidence {
  bytes observer_address = 1;
  bytes evidence_id = 2;
  bytes target_address = 3;
  string reason = 4;
}

// FeeParams is the parameter space that defines various amounts for transaction fees
message FeeParams {
  uint64 send_fee = 1; // @gotags: json:"sendFee"
  // NO CONFLICT STARTING AT FIELD = 14
}

// A Signature is a digital signature is a cryptographic "fingerprint" created with a private key,
// allowing others to verify the authenticity and integrity of a message using the corresponding public key
message Signature {
  // public_key: is a cryptographic code shared openly, used to verify digital signatures
  bytes public_key = 1; // @gotags: json:"publicKey"
  // signature: the bytes of the signature output from a private key which may be verified with the message and public
  bytes signature = 2;
}
