syntax = "proto3";
package types;
option go_package = "github.com/canopy-network/go-plugin/contract";

import "google/protobuf/any.proto";
import "account.proto";
// Transaction represents a request or action submitted to the network like transfer assets or perform other operations
// within the blockchain system - THIS MUST MATCH lib.Transaction EXACTLY for signing
message Transaction {
  // message_type: The type of the transaction like 'send' or 'stake'
  string message_type = 1; // @gotags: json:"messageType"
  // msg: The actual transaction message payload, which is encapsulated in a generic message format
  google.protobuf.Any msg = 2;
  // signature: The cryptographic signature used to verify the authenticity of the transaction
  Signature signature = 3;
  // created_height: The height when the transaction was created - allows 'safe pruning'
  uint64 created_height = 4; // @gotags: json:"createdHeight"
  // time: The timestamp when the transaction was created - used as temporal entropy to prevent hash collisions in txs
  uint64 time = 5;
  // fee: The fee associated with processing the transaction
  uint64 fee = 6;
  // memo: An optional message or note attached to the transaction
  string memo = 7;
  // network_id: The identity of the network the transaction is intended for
  uint64 network_id = 8; // @gotags: json:"networkID"
  // chain_id: The identity of the committee the transaction is intended for
  uint64 chain_id = 9; // @gotags: json:"chainID"
  // nonce: The sender's protocol replay-protection nonce
  uint64 nonce = 10;
  // NOTE: CAN EXTEND FUNCTIONALITY BY ADDING ADDITIONAL FIELDS
  // NO CONFLICT STARTING AT FIELD = 25
}

// EnclaveRevocation is an emergency control candidate approved through
// validator vote extensions. It is not a fee-paying transaction.
message EnclaveRevocation {
  string tee_key_id = 1;
  bytes incident_id = 2;
}

// MessageRegisterServicer is the single initial-registration operation.
message MessageRegisterServicer {
  bytes owner_address = 1;
  bytes evm_payout_address = 2;
  string tee_key_id = 3;
  repeated ServicerModelPolicy models = 4;
  uint64 bond = 5;
  bytes public_key = 6;
  bytes nonce = 7;
  bytes user_data = 8;
  bytes proof_signature = 9;
  bytes attestation_document = 10;
}

message ServicerConfigurationUpdate {
  bytes evm_payout_address = 1;
  repeated ServicerModelPolicy models = 2;
  bool active = 3;
}

message ServicerBondUpdate {
  uint64 target_bond = 1;
  // max_debit bounds the amount that may be removed from the owner's liquid
  // account if the target is above the current bond.
  uint64 max_debit = 2;
}

message EnclaveRotation {
  string tee_key_id = 1;
  bytes public_key = 2;
  bytes nonce = 3;
  bytes user_data = 4;
  bytes proof_signature = 5;
  bytes attestation_document = 6;
}

// MessageManageServicer is a sparse post-registration update. Any combination
// of configuration, bond, and rotation may be applied atomically without
// retransmitting unchanged state. expected_revision rejects stale updates.
message MessageManageServicer {
  bytes owner_address = 1;
  uint64 expected_revision = 2;
  ServicerConfigurationUpdate configuration = 3;
  ServicerBondUpdate bond = 4;
  EnclaveRotation rotation = 5;
}

// MessageBeginServicerUnstake atomically disables new assignments and moves
// the complete bond into the account's height-locked, slashable balance.
message MessageBeginServicerUnstake {
  bytes owner_address = 1;
  uint64 expected_revision = 2;
}

message MessageObserveDeposit {
  bytes observer_address = 1;
  bytes settlement_domain_id = 2;
  bytes chain_tx_hash = 3;
  bytes requester = 4;
  uint64 amount_micros = 5;
  bytes token_amount = 6;
  // provisional is set by each observer from its local chain finality policy.
  // It is never trusted from the API request.
  bool provisional = 7;
}

// MessageResolveDeposit lets the same validator quorum either promote a
// provisional deposit after chain safe finality or orphan it after a reorg.
message MessageResolveDeposit {
  bytes observer_address = 1;
  bytes settlement_domain_id = 2;
  bytes chain_tx_hash = 3;
  string resolution = 4;
}

// MessageResolveSettlement identifies the exact execution segment whose EVM
// transaction disappeared so it can become independently settleable again.
message MessageResolveSettlement {
  bytes observer_address = 1;
  bytes settlement_domain_id = 2;
  string request_id = 3;
  bytes settlement_tx_hash = 4;
  repeated string execution_ids = 5;
  bool finalizes_request = 6;
}

message Authorization {
  string request_id = 1;
  bytes input_hash = 2;
  bytes requester = 3;
  uint64 reserved_budget = 4;
  string output_type = 5;
  repeated ModelBudget models = 6;
  // Display-only agreement observation threshold.
  uint32 display_agreement_threshold = 7;
  uint64 deadline_height = 8;
  bytes authorization_signature = 9;
  uint64 authorization_deadline = 10;
  // direct_eoa lets the native state machine verify an ordinary EOA's EIP-712
  // signature itself. Contract-wallet signatures retain validator observation.
  bool direct_eoa = 11;
  // Content address of the replicated full request input. Admission is
  // fail-closed unless this artifact was published first.
  string request_archive_id = 12;
  // ERC-1271 authorization is evaluated at this settlement chain's canonical
  // safe header.
  // EOA authorization is state-independent and leaves both fields empty.
  uint64 authorization_chain_block_number = 13;
  bytes authorization_chain_block_hash = 14;
  bytes settlement_domain_id = 15;
  int64 output_minimum = 16;
  int64 output_maximum = 17;
  repeated string output_choices = 18;
  bytes schema_hash = 19;
}

// MessageObserveAuthorizations admits a short cohort of independently signed
// requester authorizations in one Canopy transaction. Every item receives the
// same native EIP-712 validation, including a one-item cohort.
message MessageObserveAuthorizations {
  bytes observer_address = 1;
  repeated Authorization authorizations = 2;
}

// MessageQueueAuthorization publishes an ERC-1271 request intent to Native
// state. The relayer pays the normal Native transaction fee but does not
// certify the EVM fact. Validator-local watchers independently verify the
// contract wallet at the pinned finalized block and certify it through
// consensus vote extensions.
message MessageQueueAuthorization {
  bytes relayer_address = 1;
  Authorization authorization = 2;
}

message ExecutionSubmission {
  bytes receipt_json = 1;
  bytes signature = 2;
}

message MessageSubmitExecutions {
  bytes servicer_address = 1;
  repeated ExecutionSubmission executions = 2;
  // Gzip-compressed protobuf MessageSubmitExecutions containing only the
  // executions field. The outer signer identity remains uncompressed.
  bytes compressed_executions = 3;
}

message RequestFinalization {
  string request_id = 1;
  bytes settlement_tx_hash = 2;
  uint64 reserved_budget = 3;
  repeated string execution_ids = 4;
  bool finalizes_request = 5;
  uint64 request_spent = 6;
  bytes settlement_domain_id = 7;
}

message MessageFinalizeRequests {
  bytes observer_address = 1;
  repeated RequestFinalization requests = 2;
  uint64 validator_set_id = 3;
  bytes signer_bitmap = 4;
  bytes aggregate_signature = 5;
}

// MessageFinalizeSettlementBatch references the settlement certificate that
// already contains the complete request cohort. Validator watchers validate
// that certificate against the EVM transaction before certifying this compact
// observation; Native deterministically reloads the cohort by nonce+digest.
message MessageFinalizeSettlementBatch {
  bytes settlement_domain_id = 1;
  bytes settlement_tx_hash = 2;
  uint64 batch_nonce = 3;
  bytes settlement_certificate_digest = 4;
}

// EVMControlEvidence is a typed automatic-vote candidate for settlement-domain
// lifecycle and validator-set control facts observed on EVM chains.
message EVMControlEvidence {
  string proof_kind = 1;
  bytes proof_id = 2;
  bytes digest = 3;
  uint64 validator_set_id = 4;
  uint64 new_validator_set_id = 5;
  bytes settlement_domain_id = 6;
  uint64 rotation_nonce = 7;
  uint64 epoch = 8;
  bytes handoff_generation = 9;
  uint64 handoff_timestamp = 10;
  uint64 control_block_number = 11;
  bytes control_block_hash = 12;
  bytes lifecycle_intent_id = 13;
}

message MessageObserveBridgeLock {
  bytes observer_address = 1;
  bytes canonical_chain_tx_hash = 2;
  uint64 nonce = 3;
  bytes canonical_chain_sender = 4;
  bytes recipient = 5;
  uint64 amount = 6;
}

message MessageBurnBridge {
  bytes owner_address = 1;
  bytes canonical_chain_recipient = 2;
  uint64 amount = 3;
  bytes burn_id = 4;
}

message MessageObserveBridgeRelease {
  bytes observer_address = 1;
  bytes burn_id = 2;
  bytes canonical_chain_tx_hash = 3;
  uint64 nonce = 4;
  bytes canonical_chain_recipient = 5;
  uint64 amount = 6;
  uint64 validator_set_id = 7;
}

message MessageObserveEpochMint {
  bytes observer_address = 1;
  uint64 epoch = 2;
  bytes canonical_chain_tx_hash = 3;
  uint64 validator_set_id = 4;
}

message MessageSetProducerPayout {
  bytes owner_address = 1;
  bytes canonical_chain_address = 2;
}

// FeeParams is the parameter space that defines various amounts for transaction fees
message FeeParams {
  uint64 send_fee = 1; // @gotags: json:"sendFee"
  // NO CONFLICT STARTING AT FIELD = 14
}

// A Signature is a digital signature is a cryptographic "fingerprint" created with a private key,
// allowing others to verify the authenticity and integrity of a message using the corresponding public key
message Signature {
  // public_key: is a cryptographic code shared openly, used to verify digital signatures
  bytes public_key = 1; // @gotags: json:"publicKey"
  // signature: the bytes of the signature output from a private key which may be verified with the message and public
  bytes signature = 2;
}
